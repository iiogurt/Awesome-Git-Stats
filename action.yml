name: Awesome Git Stats
description: Render a beautiful GitHub stars card into your repository, no hosting required.
author: iiogurt
branding:
  icon: star
  color: yellow

inputs:
  username:
    description: GitHub username or organization to render.
    required: false
    default: ${{ github.repository_owner }}
  layout:
    description: 'Card layout: overview, repos, compact or badge.'
    required: false
    default: overview
  theme:
    description: Theme name, see the README for the full list.
    required: false
    default: default
  options:
    description: 'Extra card options as a query string, e.g. "hide_border=true&count=8".'
    required: false
    default: ''
  path:
    description: Where to write the SVG, relative to the workspace.
    required: false
    default: awesome-git-stats.svg
  token:
    description: Token used to query the GitHub GraphQL API.
    required: false
    default: ${{ github.token }}
  commit:
    description: >-
      Commit and push the card when it changed. Needs `permissions: contents: write`.
      Set to false to handle committing yourself.
    required: false
    default: 'true'
  commit-message:
    description: Commit message used when the card changed.
    required: false
    default: 'chore: update GitHub stars card'

outputs:
  path:
    description: Path of the written SVG.
    value: ${{ steps.render.outputs.path }}
  changed:
    description: '"true" when the card differs from the committed version.'
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Render card
      id: render
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/action.js"
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_LAYOUT: ${{ inputs.layout }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TOKEN: ${{ inputs.token }}
    - name: Commit card
      id: commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        CARD_PATH: ${{ inputs.path }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git add -- "$CARD_PATH"
        if git diff --cached --quiet -- "$CARD_PATH"; then
          echo "Card unchanged, nothing to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$COMMIT_MESSAGE" -- "$CARD_PATH"
        # Another job may have pushed meanwhile; replay our commit on top.
        git pull --rebase --autostash
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
