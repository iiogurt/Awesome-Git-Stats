<svg xmlns="http://www.w3.org/2000/svg" width="350" height="298" viewBox="0 0 350 298" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev&#39;s most used languages by code size: Rust 31%, TypeScript 26%, Go 12%, Python 9.8%, Jupyter Notebook 5.3%, Other 15%</title>
  <defs><linearGradient id="ags-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></linearGradient><linearGradient id="ags-inset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.34"/><stop offset="0.45" stop-color="#000" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient></defs>
  <style>
    svg{--bg:#0d1117;--border:#30363d;--title:#e6edf3;--text:#c9d1d9;--muted:#8b949e;--accent:#f2cc60;--track:#21262d;--art1:#f2cc60;--art2:#e6edf3;--art3:#f2cc60;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    .lang-name{font-size:12px;fill:var(--text)}
    .lang-pct{font-size:11px;fill:var(--muted)}
    .lang-note{font-size:11px;fill:var(--muted)}
    .ring-track{stroke:var(--track)}
    .slice{stroke:var(--bg);stroke-width:1.5;stroke-opacity:.7}
    .core-pct{font-size:15px;font-weight:700;fill:var(--title)}
    .core-name{font-size:9.5px;fill:var(--muted)}
    @keyframes ags-spin-in{from{opacity:0;transform:rotate(-90deg) scale(.7)}to{opacity:1;transform:none}}
    .spin-in{opacity:0;transform-box:fill-box;transform-origin:center;animation:ags-spin-in 1s cubic-bezier(.22,1,.36,1) forwards}
    @media (prefers-reduced-motion: reduce){.spin-in{animation:none;opacity:1;transform:none}}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="349" height="297" class="card"/>
  
  <text x="25" y="35" class="title fade">Most Used Languages</text>
  <g transform="translate(0 0)"><text x="325" y="35" class="lang-note fade" text-anchor="end">by code size</text><g class="rise" style="animation-delay:150ms">
        <text x="25" y="62" class="lang-name">Rust</text>
        <text x="325" y="62" class="lang-pct" text-anchor="end">31%</text>
        <rect x="25" y="69" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="69" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:300ms"><rect x="23" y="67" width="98.3" height="14" rx="7" fill="#dea584" opacity=".16"/><rect x="25" y="69" width="94.3" height="10" rx="5" fill="#dea584"/><rect x="25" y="69" width="94.3" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g><g class="rise" style="animation-delay:240ms">
        <text x="25" y="100" class="lang-name">TypeScript</text>
        <text x="325" y="100" class="lang-pct" text-anchor="end">26%</text>
        <rect x="25" y="107" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="107" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:390ms"><rect x="23" y="105" width="80.8" height="14" rx="7" fill="#3178c6" opacity=".16"/><rect x="25" y="107" width="76.8" height="10" rx="5" fill="#3178c6"/><rect x="25" y="107" width="76.8" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g><g class="rise" style="animation-delay:330ms">
        <text x="25" y="138" class="lang-name">Go</text>
        <text x="325" y="138" class="lang-pct" text-anchor="end">12%</text>
        <rect x="25" y="145" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="145" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:480ms"><rect x="23" y="143" width="41" height="14" rx="7" fill="#00ADD8" opacity=".16"/><rect x="25" y="145" width="37" height="10" rx="5" fill="#00ADD8"/><rect x="25" y="145" width="37" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g><g class="rise" style="animation-delay:420ms">
        <text x="25" y="176" class="lang-name">Python</text>
        <text x="325" y="176" class="lang-pct" text-anchor="end">9.8%</text>
        <rect x="25" y="183" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="183" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:570ms"><rect x="23" y="181" width="33.5" height="14" rx="7" fill="#3572A5" opacity=".16"/><rect x="25" y="183" width="29.5" height="10" rx="5" fill="#3572A5"/><rect x="25" y="183" width="29.5" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g><g class="rise" style="animation-delay:510ms">
        <text x="25" y="214" class="lang-name">Jupyter Notebook</text>
        <text x="325" y="214" class="lang-pct" text-anchor="end">5.3%</text>
        <rect x="25" y="221" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="221" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:660ms"><rect x="23" y="219" width="20" height="14" rx="7" fill="#DA5B0B" opacity=".16"/><rect x="25" y="221" width="16" height="10" rx="5" fill="#DA5B0B"/><rect x="25" y="221" width="16" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g><g class="rise" style="animation-delay:600ms">
        <text x="25" y="252" class="lang-name">Other</text>
        <text x="325" y="252" class="lang-pct" text-anchor="end">15%</text>
        <rect x="25" y="259" width="300" height="10" rx="5" class="track"/>
    <rect x="25" y="259" width="300" height="10" rx="5" fill="url(#ags-inset)"/>
        <g class="grow" style="animation-delay:750ms"><rect x="23" y="257" width="50.5" height="14" rx="7" fill="#8b949e" opacity=".16"/><rect x="25" y="259" width="46.5" height="10" rx="5" fill="#8b949e"/><rect x="25" y="259" width="46.5" height="10" rx="5" fill="url(#ags-sheen)"/></g>
      </g></g>
</svg>
