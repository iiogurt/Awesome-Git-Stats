<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev: GitHub rank S, 17,656 stars, 1,184 commits in the last year</title>
  <defs><linearGradient id="ags-ring-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></linearGradient><radialGradient id="ags-hole"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient><linearGradient id="ags-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.13"/><stop offset="0.4" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.02"/></linearGradient><linearGradient id="ags-edge-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <style>
    svg{--bg:#1a1b27;--border:#2a2e45;--title:#70a5fd;--text:#c0caf5;--muted:#737aa2;--accent:#bf91f3;--track:#24283b;--art1:#bf91f3;--art2:#70a5fd;--art3:#bf91f3;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    .stat-label{font-size:13px;font-weight:600;fill:var(--text)}
    .stat-value{font-size:13px;font-weight:700;fill:var(--title)}
    .rank-track{fill:none;stroke:var(--track);stroke-width:9}
    .rank-ring{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
    .rank-level{font-size:26px;font-weight:800;fill:var(--title)}
    .rank-note{font-size:11px;fill:var(--muted)}
    @keyframes ags-rank{from{stroke-dashoffset:100}}
    .rank-ring{animation:ags-rank 1.4s cubic-bezier(.22,1,.36,1) .3s backwards}
    @media (prefers-reduced-motion: reduce){.rank-ring{animation:none}}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="194" class="card"/>
  
  <text x="25" y="35" class="title fade">Stellar Dev&#39;s GitHub Stats</text>
