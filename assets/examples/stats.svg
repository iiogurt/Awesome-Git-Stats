    <circle cx="410" cy="108" r="46" class="rank-track"/>
    <circle cx="410" cy="108" r="46" class="rank-ring" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:0.8" transform="rotate(-90 410 108)"/>
    <circle cx="410" cy="108" r="46" fill="none" stroke="url(#ags-ring-light)" stroke-width="9"/>
    <circle cx="410" cy="108" r="41.5" fill="url(#ags-hole)"/>
    <circle cx="410" cy="108" r="37" class="glass"/><circle cx="410" cy="108" r="37" fill="url(#ags-glass)" stroke="url(#ags-edge-v)" stroke-width="1"/>
    <text x="410" y="117" class="rank-level" text-anchor="middle">S</text>
    <text x="410" y="176" class="rank-note" text-anchor="middle">top &lt;1%</text>
  </g></g>
