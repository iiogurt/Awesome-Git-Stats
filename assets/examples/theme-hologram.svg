  <style>
    svg{--bg:#021018;--border:#3ff2ff44;--title:#7ff7ff;--text:#d6fbff;--muted:#7fb3bf;--accent:#3ff2ff;--track:#ffffff14;--art1:#3ff2ff;--art2:#ffffff;--art3:#ff5cf0;--shade:#000000}
    
    text{font-family:'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:-.06em}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .card{fill:url(#ags-bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    .title,.big{filter:drop-shadow(0 0 6px var(--accent))}.icon-accent{filter:drop-shadow(0 0 4px var(--accent))}
    
    .art-c1{fill:var(--art1)}.art-c2{fill:var(--art2)}.art-c3{fill:var(--art3)}
    .art-line{stroke:var(--art1);fill:none}.art-grid{stroke:var(--art1)}
    .art-s1{stroke:var(--art1);fill:none}.art-s2{stroke:var(--art2);fill:none}.art-s3{stroke:var(--art3);fill:none}
    .art-bg{fill:var(--bg)}.art-acc{fill:var(--accent)}
    
    
    
    .big{font-size:32px;font-weight:800;fill:var(--title)}
    .caption{font-size:12.5px;fill:var(--muted)}
    .stat-value{font-size:15px;font-weight:700;fill:var(--text)}
    .stat-label{font-size:11px;fill:var(--muted)}
    .lang-name{font-size:12px;fill:var(--text)}
    .lang-pct{font-size:11px;fill:var(--muted)}
    .top-line{font-size:12px;fill:var(--muted)}
    .top-name{font-weight:600;fill:var(--text)}
    .ring-track{stroke:var(--track)}
    
  </style>
