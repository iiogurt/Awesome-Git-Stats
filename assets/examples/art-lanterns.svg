        <ellipse cy="15.1" rx="16.4" ry="15.9" fill="url(#ags-lantern)"/>
        <path d="M0 -2V5.8M0 22.3v7.9M-1.6 24.3v6.4M1.6 24.3v6.4" class="art-s2" stroke-width=".8"/>
        <ellipse cy="15.1" rx="6.3" ry="7.2" class="art-c1"/>
        <ellipse cy="15.1" rx="3.3" ry="7.2" class="art-s2" stroke-width=".7" opacity=".55"/>
        <path d="M0 7.8V22.3" class="art-s2" stroke-width=".7" opacity=".55"/>
        <rect x="-3.5" y="5.8" width="7.1" height="2.2" rx="1" class="art-c2"/>
        <rect x="-2.8" y="20.6" width="5.5" height="2.2" rx="1" class="art-c2"/>
      </g></g><g transform="translate(219.3 0)"><g class="art-swing" style="animation-delay:-0.6s;animation-duration:4.4s">
        <ellipse cy="11.7" rx="13" ry="12.6" fill="url(#ags-lantern)"/>
        <path d="M0 -2V3.9M0 17.4v7.9M-1.6 19.4v6.4M1.6 19.4v6.4" class="art-s2" stroke-width=".8"/>
        <ellipse cy="11.7" rx="5" ry="5.7" class="art-c1"/>
        <ellipse cy="11.7" rx="2.6" ry="5.7" class="art-s2" stroke-width=".7" opacity=".55"/>
        <path d="M0 5.9V17.4" class="art-s2" stroke-width=".7" opacity=".55"/>
        <rect x="-2.8" y="3.9" width="5.6" height="2.2" rx="1" class="art-c2"/>
        <rect x="-2.2" y="15.7" width="4.4" height="2.2" rx="1" class="art-c2"/>
      </g></g><g transform="translate(254.6 0)"><g class="art-swing" style="animation-delay:-2.3s;animation-duration:6s">
        <ellipse cy="17.9" rx="17.7" ry="17.2" fill="url(#ags-lantern)"/>
        <path d="M0 -2V8.1M0 25.7v7.9M-1.6 27.7v6.4M1.6 27.7v6.4" class="art-s2" stroke-width=".8"/>
        <ellipse cy="17.9" rx="6.8" ry="7.8" class="art-c1"/>
        <ellipse cy="17.9" rx="3.5" ry="7.8" class="art-s2" stroke-width=".7" opacity=".55"/>
        <path d="M0 10.1V25.7" class="art-s2" stroke-width=".7" opacity=".55"/>
        <rect x="-3.8" y="8.1" width="7.6" height="2.2" rx="1" class="art-c2"/>
        <rect x="-3" y="24" width="6" height="2.2" rx="1" class="art-c2"/>
      </g></g></g>
  <text x="25" y="35" class="title fade">Stellar Dev</text>
