  </g>
  <clipPath id="ags-bar"><rect x="25" y="86" width="300" height="8" rx="4"/></clipPath>
  <rect x="25" y="86" width="300" height="8" rx="4" class="track"/><rect x="25" y="86" width="300" height="8" rx="4" fill="url(#ags-inset)"/>
  <g clip-path="url(#ags-bar)"><g class="grow" style="animation-delay:300ms"><rect x="25.00" y="86" width="151.78" height="8" fill="#3178c6"/><rect x="176.78" y="86" width="67.18" height="8" fill="#dea584"/><rect x="243.97" y="86" width="37.55" height="8" fill="#00ADD8"/><rect x="281.52" y="86" width="21.88" height="8" fill="#3572A5"/><rect x="303.40" y="86" width="10.87" height="8" fill="#199f4b"/><rect x="314.28" y="86" width="10.72" height="8" fill="#8b949e"/><rect x="25" y="86" width="300" height="8" rx="0" fill="url(#ags-sheen)"/></g></g><g class="fade" style="animation-delay:500ms">
      <circle cx="29" cy="110" r="4" fill="#3178c6"/><circle cx="29" cy="110" r="4" fill="url(#ags-sphere)"/>
      <text x="37" y="114" class="legend">TypeScript 51%</text>
    </g><g class="fade" style="animation-delay:580ms">
      <circle cx="131.6" cy="110" r="4" fill="#dea584"/><circle cx="131.6" cy="110" r="4" fill="url(#ags-sphere)"/>
      <text x="139.63240000000002" y="114" class="legend">Rust 22%</text>
    </g><g class="fade" style="animation-delay:660ms">
      <circle cx="202.1" cy="110" r="4" fill="#00ADD8"/><circle cx="202.1" cy="110" r="4" fill="url(#ags-sphere)"/>
      <text x="210.08319999999998" y="114" class="legend">Go 13%</text>
    </g><g class="fade" style="animation-delay:740ms">
