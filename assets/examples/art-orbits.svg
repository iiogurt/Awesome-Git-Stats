        <g class="art-s3" stroke-width=".7" opacity=".4"><ellipse cx="273" cy="64" rx="58.9" ry="22.4"/><ellipse cx="273" cy="64" rx="81" ry="30.8"/><ellipse cx="273" cy="64" rx="103" ry="39.1"/><ellipse cx="273" cy="64" rx="125.1" ry="47.5"/><ellipse cx="273" cy="64" rx="147.2" ry="55.9"/></g>
        <circle cx="273" cy="64" r="34.5" fill="url(#ags-corona)" class="art-glow"/>
        <circle cx="273" cy="64" r="9.8" class="art-c2" opacity=".9"/>
        <g opacity=".9"><g transform="translate(273 64) scale(1 0.38) rotate(188)"><g class="art-spin" style="animation-delay:-1.6s;animation-duration:7s"><g transform="translate(58.9 0)"><g class="art-spin art-counter" style="animation-delay:-1.6s;animation-duration:7s"><g transform="rotate(-188) scale(1 2.6)"><circle r="5.4" fill="url(#ags-planet1)"/></g></g></g></g></g><g transform="translate(273 64) scale(1 0.38) rotate(190)"><g class="art-spin" style="animation-delay:-8.9s;animation-duration:11.3s"><g transform="translate(81 0)"><g class="art-spin art-counter" style="animation-delay:-8.9s;animation-duration:11.3s"><g transform="rotate(-190) scale(1 2.6)"><circle r="4.9" fill="url(#ags-planet3)"/></g></g></g></g></g><g transform="translate(273 64) scale(1 0.38) rotate(73)"><g class="art-spin" style="animation-delay:-1.4s;animation-duration:16.2s"><g transform="translate(103 0)"><g class="art-spin art-counter" style="animation-delay:-1.4s;animation-duration:16.2s"><g transform="rotate(-73) scale(1 2.6)"><circle r="5.3" fill="url(#ags-planet1)"/><ellipse rx="10.6" ry="2.7" transform="rotate(-20)" class="art-s2" stroke-width="1.2" opacity=".8"/></g></g></g></g></g><g transform="translate(273 64) scale(1 0.38) rotate(103)"><g class="art-spin" style="animation-delay:-15.9s;animation-duration:21.7s"><g transform="translate(125.1 0)"><g class="art-spin art-counter" style="animation-delay:-15.9s;animation-duration:21.7s"><g transform="rotate(-103) scale(1 2.6)"><circle r="3.4" fill="url(#ags-planet3)"/><g class="art-spin" style="animation-duration:4s"><circle cx="7.8" r="1.1" class="art-c2"/></g></g></g></g></g></g><g transform="translate(273 64) scale(1 0.38) rotate(358)"><g class="art-spin" style="animation-delay:-25.2s;animation-duration:27.7s"><g transform="translate(147.2 0)"><g class="art-spin art-counter" style="animation-delay:-25.2s;animation-duration:27.7s"><g transform="rotate(-358) scale(1 2.6)"><circle r="3.4" fill="url(#ags-planet1)"/></g></g></g></g></g></g></g>
  <text x="25" y="35" class="title fade">Stellar Dev</text>
  <g transform="translate(0 0)">
  <g class="rise" style="animation-delay:100ms">
    <g class="twinkle"><path class="icon-accent" transform="translate(25 51) scale(1.375)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></g>
    <text x="55" y="72" class="big">17.7k</text>
    <text x="136.92000000000002" y="72" class="caption">stars across 10 repos</text>
  </g>
  <clipPath id="ags-bar"><rect x="25" y="86" width="300" height="8" rx="4"/></clipPath>
  <rect x="25" y="86" width="300" height="8" rx="4" class="track"/>
