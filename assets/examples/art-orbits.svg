      <circle cx="29.6" cy="111" r="4" fill="#000" class="cast"/><circle cx="29" cy="110" r="4" fill="#3178c6"/><circle cx="29" cy="110" r="4" fill="url(#ags-sphere)"/>
      <text x="37" y="114" class="legend">TypeScript 51%</text>
