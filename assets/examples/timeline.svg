<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev: 1,264 contributions in the last year, about 98 a month</title>
  <defs></defs>
  <style>
    svg{--bg:#191724;--border:#26233a;--title:#ebbcba;--text:#e0def4;--muted:#908caa;--accent:#f6c177;--track:#26233a;--art1:#f6c177;--art2:#ebbcba;--art3:#f6c177;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    .axis{font-size:10.5px;fill:var(--muted)}
    .total{font-size:12px;font-weight:600;fill:var(--muted)}
    .value{font-size:11px;font-weight:700;fill:var(--title)}
    .bar{fill:url(#ags-bar-fill)}
    .bar-peak{fill:var(--accent)}
    .baseline{stroke:var(--track);stroke-width:1}
    .average{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
    .avg-label{font-size:10px;fill:var(--muted)}
    @keyframes ags-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:ags-growy .8s cubic-bezier(.22,1,.36,1) forwards}
    @media (prefers-reduced-motion: reduce){.growy{animation:none;transform:none}}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="219" class="card"/>
  
  <text x="25" y="35" class="title fade">Stellar Dev&#39;s Year in Contributions</text>
  <g transform="translate(0 0)"><defs><linearGradient id="ags-bar-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity=".3"/></linearGradient></defs>
    <text x="470" y="35" class="total fade" text-anchor="end">1,264 contributions</text>
    <text x="470" y="52" class="avg-label fade" text-anchor="end">- - avg 98 a month</text>
    <line x1="25" y1="178" x2="470" y2="178" class="baseline"/>
    <rect x="32" y="103.3" width="23" height="74.7" rx="4" class="bar growy" style="animation-delay:150ms"/>
        
        <text x="43.5" y="194" class="axis" text-anchor="middle">Nov</text><rect x="69.1" y="93.9" width="23" height="84.1" rx="4" class="bar growy" style="animation-delay:210ms"/>
        
        <text x="80.6" y="194" class="axis" text-anchor="middle">Dec</text><rect x="106.2" y="76.5" width="23" height="101.5" rx="4" class="bar growy" style="animation-delay:270ms"/>
        
        <text x="117.7" y="194" class="axis" text-anchor="middle">Jan</text><rect x="143.3" y="80.1" width="23" height="97.9" rx="4" class="bar growy" style="animation-delay:330ms"/>
        
        <text x="154.8" y="194" class="axis" text-anchor="middle">Feb</text><rect x="180.4" y="71.4" width="23" height="106.6" rx="4" class="bar growy" style="animation-delay:390ms"/>
        
        <text x="191.9" y="194" class="axis" text-anchor="middle">Mar</text><rect x="217.5" y="70" width="23" height="108" rx="4" class="bar bar-peak growy" style="animation-delay:450ms"/>
        <text x="229" y="64" class="value fade" style="animation-delay:1000ms" text-anchor="middle">149</text>
        <text x="229" y="194" class="axis" text-anchor="middle">Apr</text><rect x="254.5" y="107.7" width="23" height="70.3" rx="4" class="bar growy" style="animation-delay:510ms"/>
        
        <text x="266" y="194" class="axis" text-anchor="middle">May</text><rect x="291.6" y="143.2" width="23" height="34.8" rx="4" class="bar growy" style="animation-delay:570ms"/>
        
        <text x="303.1" y="194" class="axis" text-anchor="middle">Jun</text><rect x="328.7" y="147.6" width="23" height="30.4" rx="4" class="bar growy" style="animation-delay:630ms"/>
        
        <text x="340.2" y="194" class="axis" text-anchor="middle">Jul</text><rect x="365.8" y="138.1" width="23" height="39.9" rx="4" class="bar growy" style="animation-delay:690ms"/>
        
        <text x="377.3" y="194" class="axis" text-anchor="middle">Aug</text><rect x="402.9" y="123.6" width="23" height="54.4" rx="4" class="bar growy" style="animation-delay:750ms"/>
        
        <text x="414.4" y="194" class="axis" text-anchor="middle">Sep</text><rect x="440" y="125.8" width="23" height="52.2" rx="4" class="bar growy" style="animation-delay:810ms"/>
        <text x="451.5" y="119.8" class="value fade" style="animation-delay:1360ms" text-anchor="middle">72</text>
        <text x="451.5" y="194" class="axis" text-anchor="middle">Oct</text>
    <line x1="25" y1="106.8" x2="470" y2="106.8" class="average fade" style="animation-delay:1000ms"/></g>
</svg>
