    <circle cx="340.7" cy="62" r="4" fill="#3178c6"/><circle cx="340.7" cy="62" r="4" fill="url(#ags-sphere)"/>
       <text x="349.66999999999996" y="66" class="repo-lang">TypeScript</text>
    <path class="icon-accent" transform="translate(425.28 55) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="66" class="repo-stars" text-anchor="end">8.4k</text>
    <rect x="25" y="73" width="445" height="8" rx="4" class="track"/>
    <rect x="25" y="73" width="445" height="8" rx="4" fill="url(#ags-inset)"/>
  </g>
  <g class="grow" style="animation-delay:300ms"><rect x="23" y="71" width="449" height="12" rx="6" fill="#3178c6" opacity=".16"/><rect x="25" y="73" width="445" height="8" rx="4" fill="#3178c6"/><rect x="25" y="73" width="445" height="8" rx="4" fill="url(#ags-sheen)"/></g><g class="rise" style="animation-delay:260ms">
    <text x="25" y="106" class="repo-name">quasar-db</text>
    <circle cx="386.2" cy="102" r="4" fill="#dea584"/><circle cx="386.2" cy="102" r="4" fill="url(#ags-sphere)"/>
