    <text x="25" y="186" class="repo-name">pulsar-ml</text>
    <circle cx="363.5" cy="182" r="4" fill="#3572A5"/><circle cx="363.5" cy="182" r="4" fill="url(#ags-sphere)"/>
       <text x="372.54999999999995" y="186" class="repo-lang">Python</text>
    <path class="icon-accent" transform="translate(425.28 175) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
