    <text x="470" y="106" class="repo-stars" text-anchor="end">4k</text>
    <rect x="25" y="113" width="445" height="8" rx="4" class="track"/>
    <rect x="25" y="113" width="445" height="8" rx="4" fill="url(#ags-inset)"/>
  </g>
  <g class="grow" style="animation-delay:410ms"><rect x="23" y="111" width="212.9" height="12" rx="6" fill="#dea584" opacity=".16"/><rect x="25" y="113" width="208.9" height="8" rx="4" fill="#dea584"/><rect x="25" y="113" width="208.9" height="8" rx="4" fill="url(#ags-sheen)"/></g><g class="rise" style="animation-delay:370ms">
    <text x="25" y="146" class="repo-name">orbit-cli</text>
    <circle cx="387.8" cy="142" r="4" fill="#00ADD8"/><circle cx="387.8" cy="142" r="4" fill="url(#ags-sphere)"/>
       <text x="396.75" y="146" class="repo-lang">Go</text>
    <path class="icon-accent" transform="translate(425.28 135) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="146" class="repo-stars" text-anchor="end">2.2k</text>
    <rect x="25" y="153" width="445" height="8" rx="4" class="track"/>
    <rect x="25" y="153" width="445" height="8" rx="4" fill="url(#ags-inset)"/>
  </g>
