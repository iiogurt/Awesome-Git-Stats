<svg xmlns="http://www.w3.org/2000/svg" width="495" height="260" viewBox="0 0 495 260" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev&#39;s most starred repositories</title>
  <defs></defs>
  <style>
    svg{--bg:#1a1b27;--border:#2a2e45;--title:#70a5fd;--text:#c0caf5;--muted:#565f89;--accent:#bf91f3;--track:#24283b;--art1:#bf91f3;--art2:#70a5fd;--art3:#bf91f3}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    .repo-name{font-size:13px;font-weight:600;fill:var(--text)}
    .repo-lang{font-size:11px;fill:var(--muted)}
    .repo-stars{font-size:12px;font-weight:600;fill:var(--text)}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="259" class="card"/>
  
  <text x="25" y="35" class="title fade">Stellar Dev&#39;s Most Starred Repos</text>
  <g transform="translate(0 0)"><g class="rise" style="animation-delay:150ms">
    <text x="25" y="66" class="repo-name">nebula-ui</text>
    <circle cx="340.66999999999996" cy="62" r="4" class="dot" fill="#3178c6"/>
       <text x="349.66999999999996" y="66" class="repo-lang">TypeScript</text>
    <path class="icon-accent" transform="translate(425.28 55) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="66" class="repo-stars" text-anchor="end">8.4k</text>
    <rect x="25" y="74" width="445" height="6" rx="3" class="track"/>
  </g>
  <rect x="25" y="74" width="445.0" height="6" rx="3" class="grow" fill="#3178c6" style="animation-delay:300ms"/><g class="rise" style="animation-delay:260ms">
    <text x="25" y="106" class="repo-name">quasar-db</text>
    <circle cx="386.21" cy="102" r="4" class="dot" fill="#dea584"/>
       <text x="395.21" y="106" class="repo-lang">Rust</text>
    <path class="icon-accent" transform="translate(435.84 95) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="106" class="repo-stars" text-anchor="end">4k</text>
    <rect x="25" y="114" width="445" height="6" rx="3" class="track"/>
  </g>
  <rect x="25" y="114" width="208.9" height="6" rx="3" class="grow" fill="#dea584" style="animation-delay:410ms"/><g class="rise" style="animation-delay:370ms">
    <text x="25" y="146" class="repo-name">orbit-cli</text>
    <circle cx="387.75" cy="142" r="4" class="dot" fill="#00ADD8"/>
       <text x="396.75" y="146" class="repo-lang">Go</text>
    <path class="icon-accent" transform="translate(425.28 135) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="146" class="repo-stars" text-anchor="end">2.2k</text>
    <rect x="25" y="154" width="445" height="6" rx="3" class="track"/>
  </g>
  <rect x="25" y="154" width="116.8" height="6" rx="3" class="grow" fill="#00ADD8" style="animation-delay:520ms"/><g class="rise" style="animation-delay:480ms">
    <text x="25" y="186" class="repo-name">pulsar-ml</text>
    <circle cx="363.54999999999995" cy="182" r="4" class="dot" fill="#3572A5"/>
       <text x="372.54999999999995" y="186" class="repo-lang">Python</text>
    <path class="icon-accent" transform="translate(425.28 175) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="186" class="repo-stars" text-anchor="end">1.3k</text>
    <rect x="25" y="194" width="445" height="6" rx="3" class="track"/>
  </g>
  <rect x="25" y="194" width="68.1" height="6" rx="3" class="grow" fill="#3572A5" style="animation-delay:630ms"/><g class="rise" style="animation-delay:590ms">
    <text x="25" y="226" class="repo-name">comet.vim</text>
    <circle cx="343.41" cy="222" r="4" class="dot" fill="#199f4b"/>
       <text x="352.41" y="226" class="repo-lang">Vim Script</text>
    <path class="icon-accent" transform="translate(429.12 215) scale(0.8125)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    <text x="470" y="226" class="repo-stars" text-anchor="end">640</text>
    <rect x="25" y="234" width="445" height="6" rx="3" class="track"/>
  </g>
  <rect x="25" y="234" width="33.8" height="6" rx="3" class="grow" fill="#199f4b" style="animation-delay:740ms"/></g>
</svg>
