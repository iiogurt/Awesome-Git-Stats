  <g class="grow" style="animation-delay:630ms"><rect x="23" y="191" width="72.1" height="12" rx="6" fill="#3572A5" opacity=".16"/><rect x="25" y="193" width="68.1" height="8" rx="4" fill="#3572A5"/><rect x="25" y="193" width="68.1" height="8" rx="4" fill="url(#ags-sheen)"/></g><g class="rise" style="animation-delay:590ms">
    <text x="25" y="226" class="repo-name">comet.vim</text>
    <circle cx="343.4" cy="222" r="4" fill="#199f4b"/><circle cx="343.4" cy="222" r="4" fill="url(#ags-sphere)"/>
