  <g class="grow" style="animation-delay:740ms"><rect x="23" y="231" width="37.8" height="12" rx="6" fill="#199f4b" opacity=".16"/><rect x="25" y="233" width="33.8" height="8" rx="4" fill="#199f4b"/><rect x="25" y="233" width="33.8" height="8" rx="4" fill="url(#ags-sheen)"/></g></g>
