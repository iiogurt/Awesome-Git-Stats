<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev: 1,264 of 1,500 contributions goal, 84%</title>
  <defs><linearGradient id="ags-bg" gradientTransform="rotate(20 0.5 0.5)"><stop offset="0%" stop-color="#0a2540"/><stop offset="50%" stop-color="#13456b"/><stop offset="100%" stop-color="#1b6a8f"/></linearGradient></defs>
  <style>
    svg{--bg:#0a2540;--border:#ffffff22;--title:#7fdbff;--text:#e0f4ff;--muted:#9cc7e0;--accent:#ffd23f;--track:#ffffff1f;--art1:#ffd23f;--art2:#7fdbff;--art3:#ffd23f;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:url(#ags-bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    
    .percent{font-size:44px;font-weight:800;fill:var(--title)}
    .detail{font-size:13px;font-weight:600;fill:var(--text)}
    .status{font-size:12px;font-weight:700;fill:var(--accent)}
    .period{font-size:11px;fill:var(--muted)}
    .liquid{fill:var(--title)}
    @keyframes ags-fill-up{from{transform:translateY(var(--depth))}to{transform:none}}
    .fill-up{animation:ags-fill-up 2.2s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes ags-wave{to{transform:translateX(-100px)}}
    .wave{animation:ags-wave 8s linear infinite}
    @media (prefers-reduced-motion: reduce){.fill-up,.wave{animation:none}}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="399" height="199" class="card"/>
  
  <text x="25" y="35" class="title fade">Stellar Dev&#39;s Contribution Goal</text>
