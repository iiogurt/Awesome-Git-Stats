        <g class="art-loop" style="animation-duration:9s"><path d="M97.6 117.4h16.6M45 102.7h20.8M108.7 87.8h20.5M29.4 80.8h19.6M285.8 113.2h13.6M236.5 76.3h21.7M257.5 68.3h20.9M71.5 121.5h12.4M334.5 95.9h8M66.7 78h6M336.1 105.3h16.2M132 127.4h19.2M22.7 68.3h21.6M179.4 74.3h14.1" class="art-s2" stroke-width=".8" stroke-linecap="round" opacity=".35"/><g transform="translate(-350 0)"><path d="M97.6 117.4h16.6M45 102.7h20.8M108.7 87.8h20.5M29.4 80.8h19.6M285.8 113.2h13.6M236.5 76.3h21.7M257.5 68.3h20.9M71.5 121.5h12.4M334.5 95.9h8M66.7 78h6M336.1 105.3h16.2M132 127.4h19.2M22.7 68.3h21.6M179.4 74.3h14.1" class="art-s2" stroke-width=".8" stroke-linecap="round" opacity=".35"/></g></g></g>
