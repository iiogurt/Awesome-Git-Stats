<svg xmlns="http://www.w3.org/2000/svg" width="350" height="128" viewBox="0 0 350 128" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev has earned 17,656 GitHub stars</title>
  <defs><radialGradient id="ags-core"><stop offset="0" style="stop-color:var(--art2)" stop-opacity="0.35"/><stop offset="1" style="stop-color:var(--art2)" stop-opacity="0"/></radialGradient><linearGradient id="ags-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></linearGradient><linearGradient id="ags-inset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.34"/><stop offset="0.45" stop-color="#000" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient><radialGradient id="ags-sphere" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.4"/></radialGradient></defs>
  <style>
    svg{--bg:#0d1117;--border:#30363d;--title:#e6edf3;--text:#c9d1d9;--muted:#8b949e;--accent:#f2cc60;--track:#21262d;--art1:#f2cc60;--art2:#e6edf3;--art3:#f2cc60;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    .art-c1{fill:var(--art1)}.art-c2{fill:var(--art2)}.art-c3{fill:var(--art3)}
    .art-line{stroke:var(--art1);fill:none}.art-grid{stroke:var(--art1)}
    .art-s1{stroke:var(--art1);fill:none}.art-s2{stroke:var(--art2);fill:none}.art-s3{stroke:var(--art3);fill:none}
    .art-bg{fill:var(--bg)}.art-acc{fill:var(--accent)}
    
    @keyframes ags-twk{50%{opacity:.12}}
    .art-tw{animation:ags-twk 3.5s ease-in-out infinite}
    @keyframes ags-streak{0%{transform:scaleX(.3);opacity:0}30%{opacity:.9}100%{transform:scaleX(2.4);opacity:0}}
        .art-streak{animation:ags-streak 1.8s cubic-bezier(.5,0,1,1) infinite}
        @keyframes ags-ring{0%{transform:scale(.6);opacity:0}30%{opacity:.4}100%{transform:scale(1.6);opacity:0}}
        .art-ring{transform-box:fill-box;transform-origin:center;animation:ags-ring 4s cubic-bezier(.5,0,1,1) infinite}
    @media (prefers-reduced-motion: reduce){.art-layer *{animation:none!important}}
    
    .big{font-size:28px;font-weight:800;fill:var(--title)}
    .caption{font-size:12.5px;fill:var(--muted)}
    .legend{font-size:11px;fill:var(--text)}
  </style>
