<svg xmlns="http://www.w3.org/2000/svg" width="350" height="128" viewBox="0 0 350 128" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev has earned 17,656 GitHub stars</title>
  <defs><radialGradient id="ags-sky-sun"><stop offset="0" style="stop-color:var(--art1)" stop-opacity="0.6"/><stop offset="1" style="stop-color:var(--art1)" stop-opacity="0"/></radialGradient></defs>
  <style>
    svg{--bg:#0d1117;--border:#30363d;--title:#e6edf3;--text:#c9d1d9;--muted:#8b949e;--accent:#f2cc60;--track:#21262d;--art1:#f2cc60;--art2:#e6edf3;--art3:#f2cc60;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    .art-c1{fill:var(--art1)}.art-c2{fill:var(--art2)}.art-c3{fill:var(--art3)}
    .art-line{stroke:var(--art1);fill:none}.art-grid{stroke:var(--art1)}
    .art-s1{stroke:var(--art1);fill:none}.art-s2{stroke:var(--art2);fill:none}.art-s3{stroke:var(--art3);fill:none}
    .art-bg{fill:var(--bg)}.art-acc{fill:var(--accent)}
    
    @keyframes ags-twk{50%{opacity:.12}}
    .art-tw{animation:ags-twk 3.5s ease-in-out infinite}
    @keyframes ags-drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
        .art-drift{animation:ags-drift 40s ease-in-out infinite}
        @keyframes ags-rays{to{transform:rotate(360deg)}}
        .art-rays{animation:ags-rays 90s linear infinite}
    @media (prefers-reduced-motion: reduce){.art-layer *{animation:none!important}}
    
    .big{font-size:28px;font-weight:800;fill:var(--title)}
    .caption{font-size:12.5px;fill:var(--muted)}
    .legend{font-size:11px;fill:var(--text)}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="349" height="127" class="card"/>
  <clipPath id="ags-clip"><rect x="0.5" y="0.5" rx="10" width="349" height="127"/></clipPath>
  <g class="art-layer" clip-path="url(#ags-clip)" aria-hidden="true"><circle cx="322" cy="-6.4" r="89.6" fill="url(#ags-sky-sun)"/>
        <g transform="translate(322 -6.4)"><path d="M0 0L150.8 29.4L147.1 44.3ZM0 0L84.3 128.4L71 136.2ZM0 0L-35.1 149.5L-49.9 145.3ZM0 0L-115.5 101.2L-125.1 89.2ZM0 0L-149.8 -34L-145.6 -48.8ZM0 0L-106.6 -110.6L-95 -120.7ZM0 0L0.2 -153.6L15.5 -152.8ZM0 0L130.4 -81.2L137.8 -67.8Z" class="art-c1 art-rays" opacity=".09"/></g>
        <g class="art-c1" opacity=".14"><circle cx="277.9" cy="14.7" r="3.4"/><circle cx="248.5" cy="28.8" r="6.9"/><circle cx="211.8" cy="46.4" r="4.4"/></g><g class="art-drift" opacity=".5" style="animation-delay:-16.4s"><g class="art-c3"><circle cx="-1.2" cy="115.9" r="35.3"/><circle cx="39.7" cy="106.1" r="57.1"/><circle cx="80.5" cy="107.7" r="53.6"/><circle cx="121.4" cy="117.9" r="30.9"/><rect x="-21.6" y="95" width="163.4" height="36.8" rx="18.4"/></g><g class="art-c2"><circle cx="-3.6" cy="107.8" r="33.2"/><circle cx="37.2" cy="98" r="53.6"/><circle cx="78.1" cy="99.6" r="50.4"/><circle cx="118.9" cy="109.8" r="29.1"/><rect x="-24.1" y="86.9" width="163.4" height="36.8" rx="18.4"/></g></g><g class="art-drift" opacity=".5" style="animation-delay:-13.1s"><g class="art-c3"><circle cx="189.2" cy="110.6" r="27.3"/><circle cx="223.3" cy="105.1" r="39.5"/><circle cx="257.4" cy="105.6" r="38.4"/><circle cx="291.5" cy="106.8" r="35.7"/><circle cx="325.6" cy="112.5" r="23.2"/><rect x="172.2" y="92.2" width="170.5" height="30.7" rx="15.3"/></g><g class="art-c2"><circle cx="186.7" cy="103.8" r="25.7"/><circle cx="220.8" cy="98.4" r="37.1"/><circle cx="254.9" cy="98.9" r="36.1"/><circle cx="289" cy="100.1" r="33.6"/><circle cx="323.1" cy="105.7" r="21.8"/><rect x="169.6" y="85.4" width="170.5" height="30.7" rx="15.3"/></g></g><g class="art-drift" opacity=".45" style="animation-delay:-1.9s;animation-duration:32.1s"><g class="art-c3"><circle cx="208.3" cy="25.2" r="8.2"/><circle cx="219.9" cy="22.6" r="14"/><circle cx="231.5" cy="22.9" r="13.5"/><circle cx="243.2" cy="23.3" r="12.6"/><circle cx="254.8" cy="24.7" r="9.4"/><rect x="202.5" y="18.5" width="58" height="10.4" rx="5.2"/></g><g class="art-c2"><circle cx="207.5" cy="22.9" r="7.7"/><circle cx="219.1" cy="20.3" r="13.2"/><circle cx="230.7" cy="20.6" r="12.7"/><circle cx="242.3" cy="21" r="11.8"/><circle cx="253.9" cy="22.4" r="8.8"/><rect x="201.7" y="16.2" width="58" height="10.4" rx="5.2"/></g></g><g class="art-drift" opacity=".45" style="animation-delay:-18.1s;animation-duration:35.5s"><g class="art-c3"><circle cx="180.3" cy="43.2" r="5.9"/><circle cx="188.7" cy="41.8" r="9.2"/><circle cx="197.2" cy="41.5" r="9.8"/><circle cx="205.6" cy="40.7" r="11.5"/><circle cx="214" cy="41.6" r="9.6"/><circle cx="222.5" cy="43.4" r="5.5"/><rect x="176.1" y="38.3" width="50.6" height="7.6" rx="3.8"/></g><g class="art-c2"><circle cx="179.5" cy="41.6" r="5.5"/><circle cx="188" cy="40.1" r="8.7"/><circle cx="196.4" cy="39.8" r="9.2"/><circle cx="204.8" cy="39.1" r="10.8"/><circle cx="213.3" cy="39.9" r="9"/><circle cx="221.7" cy="41.7" r="5.2"/><rect x="175.3" y="36.6" width="50.6" height="7.6" rx="3.8"/></g></g></g>
  <text x="25" y="35" class="title fade">Stellar Dev</text>
  <g transform="translate(0 0)">
  <g class="rise" style="animation-delay:100ms">
    <g class="twinkle"><path class="icon-accent" transform="translate(25 51) scale(1.375)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></g>
    <text x="55" y="72" class="big">17.7k</text>
    <text x="136.92000000000002" y="72" class="caption">stars across 10 repos</text>
  </g>
  <clipPath id="ags-bar"><rect x="25" y="86" width="300" height="8" rx="4"/></clipPath>
  <rect x="25" y="86" width="300" height="8" rx="4" class="track"/>
  <g clip-path="url(#ags-bar)"><g class="grow" style="animation-delay:300ms"><rect x="25.00" y="86" width="151.78" height="8" fill="#3178c6"/><rect x="176.78" y="86" width="67.18" height="8" fill="#dea584"/><rect x="243.97" y="86" width="37.55" height="8" fill="#00ADD8"/><rect x="281.52" y="86" width="21.88" height="8" fill="#3572A5"/><rect x="303.40" y="86" width="10.87" height="8" fill="#199f4b"/><rect x="314.28" y="86" width="10.72" height="8" fill="#8b949e"/></g></g><g class="fade" style="animation-delay:500ms">
      <circle cx="29" cy="110" r="4" fill="#3178c6"/>
      <text x="37" y="114" class="legend">TypeScript 51%</text>
    </g><g class="fade" style="animation-delay:580ms">
      <circle cx="131.63240000000002" cy="110" r="4" fill="#dea584"/>
      <text x="139.63240000000002" y="114" class="legend">Rust 22%</text>
    </g><g class="fade" style="animation-delay:660ms">
      <circle cx="202.08319999999998" cy="110" r="4" fill="#00ADD8"/>
      <text x="210.08319999999998" y="114" class="legend">Go 13%</text>
    </g><g class="fade" style="animation-delay:740ms">
      <circle cx="261.402" cy="110" r="4" fill="#3572A5"/>
      <text x="269.402" y="114" class="legend">Python 7%</text>
    </g></g>
</svg>
