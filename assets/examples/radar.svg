<svg xmlns="http://www.w3.org/2000/svg" width="495" height="270" viewBox="0 0 495 270" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev&#39;s contribution profile, rank S</title>
  <defs><radialGradient id="ags-sphere" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.4"/></radialGradient><radialGradient id="ags-dome" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity="0.36"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/><stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></radialGradient></defs>
  <style>
    svg{--bg:#1e1e2e;--border:#313244;--title:#cba6f7;--text:#cdd6f4;--muted:#a6adc8;--accent:#f9e2af;--track:#313244;--art1:#f9e2af;--art2:#cba6f7;--art3:#f9e2af;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    
    
    .grid{fill:none;stroke:var(--track);stroke-width:1}
    .grid-mid{stroke-dasharray:3 3;stroke:var(--muted);stroke-opacity:.5}
    .shape{fill:var(--accent);fill-opacity:.32;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
    .axis{font-size:11px;fill:var(--muted)}
    .rank{font-size:30px;font-weight:800;fill:var(--title)}
    .rank-note{font-size:11px;fill:var(--muted)}
    .row-label{font-size:12px;fill:var(--text)}
    .row-value{font-size:12px;font-weight:700;fill:var(--title)}
    @keyframes ags-grow-out{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    .grow-out{transform:scale(0);animation:ags-grow-out 1.1s cubic-bezier(.22,1,.36,1) forwards}
    @media (prefers-reduced-motion: reduce){.grow-out{animation:none;transform:none}}
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="269" class="card"/>
  
  <text x="25" y="35" class="title fade">Stellar Dev&#39;s Contribution Profile</text>
  <g transform="translate(0 0)">
    <g transform="translate(160 155)">
      <g class="fade"><path d="M0 -19.5L16.9 -9.7L16.9 9.7L0 19.5L-16.9 9.8L-16.9 -9.8Z" class="grid"/><path d="M0 -39L33.8 -19.5L33.8 19.5L0 39L-33.8 19.5L-33.8 -19.5Z" class="grid grid-mid"/><path d="M0 -58.5L50.7 -29.2L50.7 29.2L0 58.5L-50.7 29.3L-50.7 -29.3Z" class="grid"/><path d="M0 -78L67.5 -39L67.5 39L0 78L-67.5 39L-67.5 -39Z" class="grid"/><path d="M0 0L0 -78" class="grid"/><path d="M0 0L67.5 -39" class="grid"/><path d="M0 0L67.5 39" class="grid"/><path d="M0 0L0 78" class="grid"/><path d="M0 0L-67.5 39" class="grid"/><path d="M0 0L-67.5 -39" class="grid"/></g>
      <g class="grow-out" style="animation-delay:250ms"><path d="M0 -75.1L67.5 -39L67.5 39L0 78L-67.4 38.9L-67.3 -38.8Z" class="shape"/><path d="M0 -75.1L67.5 -39L67.5 39L0 78L-67.4 38.9L-67.3 -38.8Z" fill="url(#ags-dome)" opacity=".6"/><circle cx="0" cy="-75.1" r="3.5" class="accent"/><circle cx="0" cy="-75.1" r="3.5" fill="url(#ags-sphere)"/><circle cx="67.5" cy="-39" r="3.5" class="accent"/><circle cx="67.5" cy="-39" r="3.5" fill="url(#ags-sphere)"/><circle cx="67.5" cy="39" r="3.5" class="accent"/><circle cx="67.5" cy="39" r="3.5" fill="url(#ags-sphere)"/><circle cx="0" cy="78" r="3.5" class="accent"/><circle cx="0" cy="78" r="3.5" fill="url(#ags-sphere)"/><circle cx="-67.4" cy="38.9" r="3.5" class="accent"/><circle cx="-67.4" cy="38.9" r="3.5" fill="url(#ags-sphere)"/><circle cx="-67.3" cy="-38.8" r="3.5" class="accent"/><circle cx="-67.3" cy="-38.8" r="3.5" fill="url(#ags-sphere)"/></g>
      <g class="fade" style="animation-delay:400ms"><text x="0" y="-90" class="axis" text-anchor="middle">Commits</text><text x="81.4" y="-43" class="axis" text-anchor="start">Pull requests</text><text x="81.4" y="51" class="axis" text-anchor="start">Reviews</text><text x="0" y="98" class="axis" text-anchor="middle">Issues</text><text x="-81.4" y="51" class="axis" text-anchor="end">Stars</text><text x="-81.4" y="-43" class="axis" text-anchor="end">Followers</text></g>
    </g>
    <g class="fade" style="animation-delay:300ms">
      <text x="330" y="80" class="rank">S</text>
      <text x="370" y="80" class="rank-note">rank, top &lt;1%</text>
    </g>
    <g class="rise" style="animation-delay:500ms">
        <text x="330" y="112" class="row-label">Commits</text>
        <text x="470" y="112" class="row-value" text-anchor="end">1.2k</text>
      </g><g class="rise" style="animation-delay:580ms">
        <text x="330" y="134" class="row-label">Pull requests</text>
        <text x="470" y="134" class="row-value" text-anchor="end">642</text>
      </g><g class="rise" style="animation-delay:660ms">
        <text x="330" y="156" class="row-label">Reviews</text>
        <text x="470" y="156" class="row-value" text-anchor="end">228</text>
      </g><g class="rise" style="animation-delay:740ms">
        <text x="330" y="178" class="row-label">Issues</text>
        <text x="470" y="178" class="row-value" text-anchor="end">318</text>
      </g><g class="rise" style="animation-delay:820ms">
        <text x="330" y="200" class="row-label">Stars</text>
        <text x="470" y="200" class="row-value" text-anchor="end">17.7k</text>
      </g><g class="rise" style="animation-delay:900ms">
        <text x="330" y="222" class="row-label">Followers</text>
        <text x="470" y="222" class="row-value" text-anchor="end">2.5k</text>
      </g></g>
</svg>
