<svg xmlns="http://www.w3.org/2000/svg" width="350" height="128" viewBox="0 0 350 128" fill="none" role="img" aria-labelledby="ags-title">
  <title id="ags-title">Stellar Dev has earned 17,656 GitHub stars</title>
  <defs><radialGradient id="ags-bell1" cx=".5" cy=".8" r=".8"><stop offset="0" style="stop-color:var(--art2)" stop-opacity=".7"/><stop offset=".45" style="stop-color:var(--art1)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--art1)" stop-opacity=".12"/></radialGradient><radialGradient id="ags-bell3" cx=".5" cy=".8" r=".8"><stop offset="0" style="stop-color:var(--art2)" stop-opacity=".7"/><stop offset=".45" style="stop-color:var(--art3)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--art3)" stop-opacity=".12"/></radialGradient><radialGradient id="ags-jellyglow1"><stop offset="0" style="stop-color:var(--art1)" stop-opacity="0.28"/><stop offset="1" style="stop-color:var(--art1)" stop-opacity="0"/></radialGradient><radialGradient id="ags-jellyglow3"><stop offset="0" style="stop-color:var(--art3)" stop-opacity="0.28"/><stop offset="1" style="stop-color:var(--art3)" stop-opacity="0"/></radialGradient><linearGradient id="ags-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></linearGradient><linearGradient id="ags-inset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.34"/><stop offset="0.45" stop-color="#000" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient><radialGradient id="ags-sphere" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.4"/></radialGradient></defs>
  <style>
    svg{--bg:#0d1117;--border:#30363d;--title:#e6edf3;--text:#c9d1d9;--muted:#8b949e;--accent:#f2cc60;--track:#21262d;--art1:#f2cc60;--art2:#e6edf3;--art3:#f2cc60;--shade:#000000}
    
    text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .title{font-size:18px;font-weight:600;fill:var(--title)}
    .text{fill:var(--text)}
    .muted{fill:var(--muted)}
    .accent{fill:var(--accent)}
    .icon{fill:var(--muted)}
    .icon-accent{fill:var(--accent)}
    .track{fill:var(--track)}
    .glass{fill:var(--bg);fill-opacity:.55}
    .card{fill:var(--bg);stroke:var(--border);stroke-width:1;stroke-opacity:1}
    
    @keyframes ags-fade{from{opacity:0}to{opacity:1}}
    @keyframes ags-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes ags-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes ags-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(8deg)}}
    .fade{opacity:0;animation:ags-fade .6s ease-out forwards}
    .rise{opacity:0;animation:ags-rise .6s ease-out forwards}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ags-grow .9s cubic-bezier(.22,1,.36,1) forwards}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:ags-twinkle 3s ease-in-out 1s infinite}
    @media (prefers-reduced-motion: reduce){.fade,.rise,.grow,.twinkle{animation:none;opacity:1;transform:none}}
    .art-c1{fill:var(--art1)}.art-c2{fill:var(--art2)}.art-c3{fill:var(--art3)}
    .art-line{stroke:var(--art1);fill:none}.art-grid{stroke:var(--art1)}
    .art-s1{stroke:var(--art1);fill:none}.art-s2{stroke:var(--art2);fill:none}.art-s3{stroke:var(--art3);fill:none}
    .art-bg{fill:var(--bg)}.art-acc{fill:var(--accent)}
    .art-rim1{stroke:var(--art1)}.art-rim3{stroke:var(--art3)}
    @keyframes ags-twk{50%{opacity:.12}}
    .art-tw{animation:ags-twk 3.5s ease-in-out infinite}
    @keyframes ags-loop{from{transform:translate(0,0)}to{transform:translate(0px,-128px)}}
  .art-loop{animation:ags-loop 10s linear infinite}
        @keyframes ags-swim{0%,100%{transform:translate(0,0)}50%{transform:translate(7.4px,-14.8px)}}
        .art-swim{animation:ags-swim 16s ease-in-out infinite}
        @keyframes ags-bell{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,.82)}}
        .art-bell{animation:ags-bell 2.6s ease-in-out infinite}
        @keyframes ags-trail{0%,100%{transform:skewX(-8deg)}50%{transform:skewX(8deg)}}
        .art-trail{animation:ags-trail 3.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.art-layer *{animation:none!important}}
    
    .big{font-size:28px;font-weight:800;fill:var(--title)}
    .caption{font-size:12.5px;fill:var(--muted)}
    .legend{font-size:11px;fill:var(--text)}
  </style>
