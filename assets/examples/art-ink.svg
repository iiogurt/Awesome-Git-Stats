          <path d="M7.4 123.1C70 120.1 122.5 126 175 123.1" stroke-width=".8" pathLength="1" class="art-draw" style="animation-delay:200ms"/>
        </g>
        <circle cx="332.3" cy="111.4" r="1.6" class="art-c3" opacity=".6"/></g>
  <text x="25" y="35" class="title fade">Stellar Dev</text>
