    </g><g class="fade" style="animation-delay:580ms">
      <circle cx="131.63240000000002" cy="110" r="4" fill="#dea584"/>
      <text x="139.63240000000002" y="114" class="legend">Rust 22%</text>
    </g><g class="fade" style="animation-delay:660ms">
      <circle cx="202.08319999999998" cy="110" r="4" fill="#00ADD8"/>
      <text x="210.08319999999998" y="114" class="legend">Go 13%</text>
    </g><g class="fade" style="animation-delay:740ms">
