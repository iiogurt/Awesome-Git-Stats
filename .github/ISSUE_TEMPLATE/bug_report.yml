name: Bug report
description: Something looks wrong or the card doesn't load.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Card URL
      description: The full image URL from your README.
      placeholder: https://your-instance.vercel.app/api/stars?username=octocat&theme=dracula
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to see, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you viewing the card?
      options:
        - GitHub profile README (light mode)
        - GitHub profile README (dark mode)
        - Somewhere else
