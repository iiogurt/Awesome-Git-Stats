name: Auto-merge

# Turns on squash auto-merge for trusted pull requests, so they merge by
# themselves once every required check is green, and deletes the branch
# afterwards. No code from the pull request is checked out or run here.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      # Merges made with the built-in token don't trigger other workflows, so
      # the Release workflow wouldn't run after them. A GitHub App token (or a
      # personal access token in RELEASE_TOKEN) avoids that; see CONTRIBUTING.md.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  cleanup:
    name: Delete merged branch
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The branch may already be gone if GitHub's own auto-delete ran first.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            && echo "Deleted $BRANCH" || echo "Branch $BRANCH was already deleted"
