name: Auto-merge

# Turns on squash auto-merge for trusted pull requests, so they merge by
# themselves once every required check is green. GitHub deletes the branch
# afterwards (Automatically delete head branches). No code from the pull
# request is checked out or run here.
#
# Dependabot pull requests auto-merge only for patch and minor updates;
# major updates wait for a review.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - id: dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
      - name: Leave major updates for review
        if: steps.dependabot.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update, so auto-merge stays off. Review and merge it by hand."
      # Merges made with the built-in token don't trigger other workflows, so
      # the Release workflow wouldn't run after them; the release bot's token
      # avoids that. Runs started by Dependabot get no Actions secrets, so
      # Dependabot pull requests use the built-in token; release-please picks
      # their commits up with the next merge.
      - id: app-token
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Enable squash auto-merge
        if: steps.dependabot.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
