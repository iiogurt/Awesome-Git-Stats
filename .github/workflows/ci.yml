name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  examples:
    name: Examples up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run examples
      - name: Check for changes
        run: |
          if ! git diff --exit-code -- assets/examples docs/themes.md public/index.html || [ -n "$(git status --porcelain -- assets/examples)" ]; then
            echo "::error::Example cards are out of date. Run 'npm run examples' and commit the result."
            exit 1
          fi

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          username: ${{ github.repository_owner }}
          layout: compact
          theme: tokyonight
          path: out/card.svg
          commit: false
      - run: grep -q '<svg' out/card.svg
      - uses: ./
        with:
          username: ${{ github.repository_owner }}
          theme: sakura
          dark-theme: match
          dark-options: art=starfield
          path: out/pair.svg
          commit: false
      # match: sakura (light) + sakura_dark, whose background is #2a1420.
      - run: grep -q 'art-layer' out/pair.svg && grep -q -- '--bg:#2a1420' out/pair-dark.svg
      # The dashboard runs the contribution-activity query against the real API.
      - uses: ./
        with:
          username: ${{ github.repository_owner }}
          layout: dashboard
          path: out/dashboard.svg
          commit: false
      - run: grep -q 'Current streak' out/dashboard.svg
