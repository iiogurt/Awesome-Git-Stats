name: Release

on:
  push:
    branches: [main]
  # Releases published by hand also move the major tag.
  release:
    types: [published]
  # On demand, e.g. after Dependabot merges: they use the built-in token, so
  # they don't trigger the push event.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the built-in token, GitHub runs no CI on the release PR, so its
      # required checks never report and it can't auto-merge. The release
      # bot's token makes it a normal PR; see CONTRIBUTING.md.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Keep a moving major tag (v1, v2, ...) so Action users can pin
  # `iiogurt/Awesome-Git-Stats@v1` and receive compatible updates.
  update-major-tag:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    steps:
      # The release bot's token can also move the tag to a commit whose
      # workflow files differ from main, which GITHUB_TOKEN may not.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Move major tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag '$TAG'"
            exit 1
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
